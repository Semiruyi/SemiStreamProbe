name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-msvc:
    name: Windows / MSVC / Release
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Configure
        run: cmake -S . -B build/ci-windows -A x64 -DSSP_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build/ci-windows --config Release --parallel

      - name: Test
        run: ctest --test-dir build/ci-windows -C Release --output-on-failure

      - name: Package portable ZIP
        run: cpack --config build/ci-windows/CPackConfig.cmake -C Release -G ZIP

      - name: Verify portable ZIP
        shell: pwsh
        run: |
          $archive = Get-ChildItem build/ci-windows/package/*.zip | Select-Object -First 1
          if (-not $archive) { throw "portable ZIP was not generated" }
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath build/ci-package-check
          $root = Get-ChildItem build/ci-package-check -Directory | Select-Object -First 1
          & "$($root.FullName)/bin/semistreamprobe.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$($root.FullName)/bin/semistreamprobe_demo.exe" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: SemiStreamProbe-0.1.0-windows-x64
          path: |
            build/ci-windows/package/*.zip
            build/ci-windows/package/*.sha256
          if-no-files-found: error

  linux-sanitizers:
    name: Linux / GCC / ASan+UBSan
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Configure
        run: cmake --preset linux-sanitizers

      - name: Build
        run: cmake --build --preset linux-sanitizers --parallel

      - name: Test
        run: ctest --preset linux-sanitizers
